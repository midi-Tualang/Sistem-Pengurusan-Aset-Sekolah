<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Aset Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Tambahan styling premium */
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-blue-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-school text-xl"></i>
                    <span class="font-bold text-lg tracking-wide">E-Aset Sekolah</span>
                </div>
                <div>
                    <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-all shadow-sm">
                        <i class="fa-solid fa-plus mr-1"></i> Tambah Aset
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Senarai Perabot & PC</h1>
                <p class="text-slate-500 text-sm">Urus dan rekod aset secara berpusat.</p>
            </div>
            <div class="relative w-full md:w-64">
                <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400"></i>
                <input type="text" placeholder="Cari aset..." class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            </div>
        </div>

        <div class="glass-card shadow-sm rounded-xl border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Nama Aset</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Kategori</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Lokasi</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-slate-200" id="tableBody">
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-800">PC Guru - Bilik Guru 1</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">Elektronik / PC</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">Bilik Guru</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <button onclick="duplicateRecord('PC Guru - Bilik Guru 1', 'Elektronik / PC', 'Bilik Guru')" class="text-blue-600 hover:text-blue-900 bg-blue-50 px-3 py-1 rounded-md transition-colors">
                                    <i class="fa-regular fa-copy mr-1"></i> Duplicate
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Logika untuk fetch data dari GAS dan populate table akan diletakkan di sini.
        // Logika untuk Duplicate:
        function duplicateRecord(nama, kategori, lokasi) {
            // Isi form modal dengan data yang disalin
            alert(`Sedia untuk duplicate: ${nama}. Borang akan dibuka dengan pra-isi (pre-filled).`);
            // openModal(); -> letakkan nilai dalam input field
        }

        function openModal() {
            // Kod untuk buka pop-up form
            console.log("Buka form pendaftaran");
        }
    </script>
    <div id="asetModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden flex items-center justify-center backdrop-blur-sm z-50">
        <div class="bg-white rounded-xl shadow-xl w-11/12 md:w-1/2 max-w-lg p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800" id="modalTitle">Tambah Aset Baru</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 text-2xl">&times;</button>
            </div>
            <form id="asetForm" onsubmit="simpanData(event)">
                <input type="hidden" id="asetId">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Aset (Cth: Meja Murid)</label>
                    <input type="text" id="namaAset" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
                        <select id="kategoriAset" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Pilih...</option>
                            <option value="Perabot">Perabot</option>
                            <option value="Elektronik / PC">Elektronik / PC</option>
                            <option value="Buku / ABM">Buku / ABM</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Lokasi</label>
                        <input type="text" id="lokasiAset" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
                    <select id="statusAset" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Baik">Baik</option>
                        <option value="Rosak">Rosak</option>
                        <option value="Dihapus Kira">Dihapus Kira</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-md font-medium">Batal</button>
                    <button type="submit" id="btnSimpan" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium flex items-center gap-2">
                        Simpan Aset
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // MASUKKAN URL WEB APP ANDA DI SINI
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzJ_hJvfC-r2ZsV9iwVrQgGeq2cI6EPtTLjmNeCtcyR21S207jhvJE_LN9PY8fzQo4/exec'; 
        
        const modal = document.getElementById('asetModal');
        const form = document.getElementById('asetForm');
        const tableBody = document.getElementById('tableBody');
        const btnSimpan = document.getElementById('btnSimpan');

        // Fungsi buka borang
        function openModal() {
            form.reset();
            document.getElementById('asetId').value = '';
            document.getElementById('modalTitle').innerText = 'Tambah Aset Baru';
            modal.classList.remove('hidden');
        }

        // Fungsi tutup borang
        function closeModal() {
            modal.classList.add('hidden');
        }

        // Fungsi Duplicate - isi form dengan data baris yang dipilih
        function duplicateRecord(nama, kategori, lokasi, status) {
            document.getElementById('asetId').value = ''; // Kosongkan ID supaya ia jadi rekod baru
            document.getElementById('namaAset').value = nama;
            document.getElementById('kategoriAset').value = kategori;
            document.getElementById('lokasiAset').value = lokasi;
            document.getElementById('statusAset').value = status || 'Baik';
            
            document.getElementById('modalTitle').innerText = 'Duplicate Aset (Ubah suai sedikit jika perlu)';
            modal.classList.remove('hidden');
        }

        // Fungsi muat turun data dari Google Sheets (GET)
        async function muatData() {
            tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-sm text-slate-500">Sedang memuat turun data...</td></tr>';
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                
                tableBody.innerHTML = ''; // Kosongkan jadual
                
                if(data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-sm text-slate-500">Tiada rekod dijumpai.</td></tr>';
                    return;
                }

                data.forEach(item => {
                    const row = `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-800">${item['Nama Aset'] || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${item['Kategori'] || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${item['Lokasi'] || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <button onclick="duplicateRecord('${item['Nama Aset']}', '${item['Kategori']}', '${item['Lokasi']}', '${item['Status']}')" class="text-blue-600 hover:text-blue-900 bg-blue-50 px-3 py-1 rounded-md transition-colors">
                                    <i class="fa-regular fa-copy mr-1"></i> Duplicate
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.insertAdjacentHTML('beforeend', row);
                });
            } catch (error) {
                console.error('Ralat:', error);
                tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-sm text-red-500">Gagal memuat turun data. Semak konsol.</td></tr>';
            }
        }

        // Fungsi hantar data baru ke Google Sheets (POST)
        async function simpanData(e) {
            e.preventDefault();
            btnSimpan.innerText = 'Menyimpan...';
            btnSimpan.disabled = true;

            const jsonData = {
                id: document.getElementById('asetId').value,
                nama_aset: document.getElementById('namaAset').value,
                kategori: document.getElementById('kategoriAset').value,
                lokasi: document.getElementById('lokasiAset').value,
                status: document.getElementById('statusAset').value
            };

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors', // Penting untuk elak isu CORS dengan Google Apps Script
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });
                
                closeModal();
                alert('Aset berjaya direkodkan!');
                muatData(); // Refresh jadual
            } catch (error) {
                console.error('Ralat simpan:', error);
                alert('Berlaku ralat semasa menyimpan data.');
            } finally {
                btnSimpan.innerText = 'Simpan Aset';
                btnSimpan.disabled = false;
            }
        }

        // Jalankan fungsi muat data apabila halaman siap dimuat
        window.onload = muatData;
    </script>
</body>
</html>
